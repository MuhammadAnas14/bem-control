# Mosquitto broker configuration for Bem Control (local development)
#
# Security model:
#  - Every client (backend service account AND every ESP32 device) authenticates
#    with a username/password over TLS. Passwords are stored as bcrypt-style
#    hashes in password_file, never in plaintext.
#  - acl_file restricts each device's username to its own topic namespace, so a
#    compromised device credential can't read or spoof another device's data.
#  - Port 1883 (plaintext) is left enabled only for local debugging with
#    mosquitto_sub/pub on localhost - it is NOT exposed outside dev.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

password_file /mosquitto/certs/passwords.txt
acl_file /mosquitto/certs/acl.conf
allow_anonymous false

# Plaintext listener - local dev convenience only
listener 1883 0.0.0.0
protocol mqtt

# MQTTS (MQTT over TLS) - used by the backend and by ESP32 firmware
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# MQTT over WebSocket (TLS) - used by web/mobile dashboards for live telemetry
listener 9001 0.0.0.0
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
