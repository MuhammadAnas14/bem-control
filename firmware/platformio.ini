; Bem Control - ESP32 telemetry + command firmware
; PlatformIO project (Arduino framework) - see docs/mqtt-topics.md for the
; topic scheme this firmware and the backend both implement.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.1.0

; Device identity/WiFi/broker credentials live in include/secrets.h, which is
; gitignored - see include/secrets.h.example for the template. Populate it
; from the QR code / API key shown once at provisioning time (see
; backend/src/services/qrCode.service.js).
build_flags =
	-DCORE_DEBUG_LEVEL=3
